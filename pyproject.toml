[project]
name = "cyberedu-mcp"
version = "0.1.0"
description = "Official MCP server for CyberEdu CTF platform. Includes cyberedu-client as a submodule."
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "cyberedu-client @ file:///${PROJECT_ROOT}/cyberedu-client",
]

[project.urls]
Homepage = "https://github.com/CyberEDU-Cyber-Range/cyberedu-mcp"
Repository = "https://github.com/CyberEDU-Cyber-Range/cyberedu-mcp"
"CyberEdu Client" = "https://github.com/CyberEDU-Cyber-Range/cyberedu-client"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/cyberedu_mcp"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
